spring.application.name=career-wave

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

server.port=8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-swallow-size=11MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT — user (USER/COMPANY): access 30min, refresh 14days
jwt.user.secret=${JWT_USER_SECRET}
jwt.user.access-expiration=1800000
jwt.user.refresh-expiration=1209600000

# JWT — admin: access 3h, refresh 1day
jwt.admin.secret=${JWT_ADMIN_SECRET}
jwt.admin.access-expiration=10800000
jwt.admin.refresh-expiration=86400000

# Session — 유휴 슬라이딩 타임아웃. 인증 요청마다 TTL을 재설정. User 60분 / Admin 180분(대시보드 장시간 사용 특성)
session.idle-timeout=3600000
session.admin-idle-timeout=10800000
session.existence-check-enabled=true

aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.s3.region=${AWS_S3_REGION:ap-northeast-2}
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.mock-upload=${AWS_S3_MOCK_UPLOAD:false}
aws.s3.presigned-url-expiration-minutes=${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:10}
aws.s3.fastapi-presigned-url-expiration-minutes=${AWS_S3_FASTAPI_PRESIGNED_URL_EXPIRATION_MINUTES:60}

fastapi.base-url=${FASTAPI_BASE_URL}

webhook.secret=${WEBHOOK_SECRET}

websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:*}

# 이메일 인증번호 발송 제공자 선택 — resend | ses (기본: resend)
email.provider=${EMAIL_PROVIDER:resend}

# Resend (이메일 인증 발송) — https://resend.com
# from-email은 Resend에서 검증한 도메인 주소여야 임의 수신자에게 발송 가능
# (도메인 미검증 시 onboarding@resend.dev는 Resend 계정 본인 메일로만 발송됨)
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# AWS SES (이메일 인증 발송, 폴백용) — Credentials는 S3와 공유, region은 별도 설정
aws.ses.region=${AWS_SES_REGION:ap-southeast-2}
aws.ses.from-email=${AWS_SES_FROM_EMAIL:}
aws.ses.access-key=${AWS_ACCESS_KEY_ID:}
aws.ses.secret-key=${AWS_SECRET_ACCESS_KEY:}

# SOLAPI / CoolSMS (SMS 인증번호 발송)
solapi.api-key=${SOLAPI_API_KEY}
solapi.api-secret=${SOLAPI_API_SECRET}
solapi.sender-phone=${SOLAPI_SENDER_PHONE}
solapi.base-url=https://api.solapi.com

# OAuth — Kakao
oauth.kakao.client-id=${KAKAO_CLIENT_ID}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET}
oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI}

# OAuth — Naver
oauth.naver.client-id=${NAVER_CLIENT_ID}
oauth.naver.client-secret=${NAVER_CLIENT_SECRET}
oauth.naver.redirect-uri=${NAVER_REDIRECT_URI}

# OAuth — Google
oauth.google.client-id=${GOOGLE_CLIENT_ID}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET}
oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI}

# NTS 국세청 사업자등록정보 상태조회 API (공공데이터포털)
nts.api.key=${PUBLIC_DATA_NTS_SERVICE_KEY}
nts.api.base-url=${NTS_BUSINESS_API_BASE_URL}

# Frontend URL (OAuth callback redirect 대상)
frontend.url=${FRONTEND_URL:http://localhost:5173}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}

# refresh token cookie Secure 속성 — HTTPS 환경(production)에서는 true, 로컬 HTTP 개발환경에서는 false
cookie.secure=${COOKIE_SECURE:true}

# 쿠키 Domain 속성 — 프론트(www)와 백엔드(api)가 서로 다른 서브도메인일 때 ".careerwave.kr"로 공유.
# 로컬(단일 host)에서는 비워 두어 host-only 쿠키로 동작
cookie.domain=${COOKIE_DOMAIN:}

# IpAclFilter가 X-Forwarded-For 헤더를 신뢰할 프록시 IP/CIDR (콤마 구분, 예: Nginx EC2 사설 IP).
# 비워두면(로컬 등 프록시 없는 환경) X-Forwarded-For를 무시하고 getRemoteAddr()만 사용
security.ip-acl.trusted-proxies=${TRUSTED_PROXY_IPS:}

# Privacy — IP/User-Agent 증적 HMAC 시크릿
privacy.hash-secret=${PRIVACY_HASH_SECRET}

# 초기 관리자 계정 — login-id/email/password 모두 설정된 경우에만 최초 기동 시 자동 생성(이미 존재하면 skip)
# name/role은 값이 비어있어도(.env에 키만 있고 값이 없는 경우 포함) InitialAdminInitializer에서 기본값으로 대체 처리한다.
admin.init.login-id=${INITIAL_ADMIN_LOGIN_ID:}
admin.init.email=${INITIAL_ADMIN_EMAIL:}
admin.init.password=${INITIAL_ADMIN_PASSWORD:}
admin.init.name=${INITIAL_ADMIN_NAME:}
admin.init.role=${INITIAL_ADMIN_ROLE:}

# =========================
# Toss Payments
#
# 지금까지 application-local.yml 에만 있어서 local 이 아닌 프로파일로는
# 'Could not resolve placeholder toss.secret-key' 로 기동 자체가 실패했다.
# (CD 가 AWS 자격증명 단계에서 먼저 멈춰 드러나지 않았던 문제)
# local 과 동일한 기본값을 그대로 옮겨 non-local 환경에서도 기동되게 한다.
# =========================
# true → 실 Toss 호출 없이 mock 게이트웨이 주입 (데모/시연용, 자동결제 계약 미개통 우회). 이슈 #986
toss.mock=${TOSS_MOCK:false}
toss.base-url=${TOSS_BASE_URL:https://api.tosspayments.com}
# mock=true 면 TossPaymentCancelClient(@ConditionalOnProperty toss.mock=false)가 아예 생성되지 않아 사용되지 않는다.
toss.secret-key=${TOSS_SECRET_KEY:mock-secret-not-used}
# AesCipher 가 무조건 로드되며 Base64 디코딩 결과가 정확히 32바이트(AES-256)여야 한다.
toss.billing-key-encryption-key=${TOSS_BILLING_KEY_ENCRYPTION_KEY}

spring:
  datasource:
    url: jdbc:h2:mem:careerwave;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

privacy:
  hash-secret: test-privacy-hmac-secret

jwt:
  user:
    secret: test-user-secret-key-must-be-at-least-32-bytes!!
    access-expiration: 1800000
    refresh-expiration: 1209600000
  admin:
    secret: test-admin-secret-key-must-be-at-least-32-bytes!
    access-expiration: 10800000
    refresh-expiration: 86400000

# StubEmploymentCertificateFileAdapter 가 @Profile({"local","test"}) 대신
# aws.s3.mock-upload 로 갈리도록 바뀌었으므로, test 프로파일에서도 명시한다.
# (기존과 동일하게 Stub 어댑터가 로드된다)
aws:
  s3:
    mock-upload: true
